name: Refresh public data

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run data:refresh
      - run: npm run check
      - name: Commit changed snapshot
        run: |
          if git diff --quiet public/data/snapshot.json; then exit 0; fi
          git config user.name "macrotrace-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/snapshot.json
          git commit -m "data: refresh public snapshot"
          git push
      - name: Publish refreshed snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main
          gh workflow run vercel.yml --ref main
