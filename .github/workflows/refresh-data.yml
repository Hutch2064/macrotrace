name: Refresh public data

on:
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: public-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Start from current main
        run: |
          set -euo pipefail
          git fetch --prune origin main
          git switch --force-create data-refresh origin/main
          git pull --rebase origin main
      - run: npm ci
      - run: npm run data:refresh
      - run: npm run check
      - name: Commit changed snapshot with a push guard
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r status; do
            path="${status:3}"
            case "$path" in
              public/data/*) ;;
              *) echo "Unexpected generated change outside public/data: $path" >&2; exit 1 ;;
            esac
          done < <(git status --porcelain=v1)
          if git diff --quiet -- public/data && test -z "$(git ls-files --others --exclude-standard public/data)"; then
            echo "No source observations changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --prune origin main
          git config user.name "macrotrace-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/snapshot.json public/data/version.json public/data/source-inventory.csv public/data/source-inventory.md public/data/country-coverage.json
          git commit -m "data: refresh public snapshot"
          for attempt in 1 2 3; do
            if ! git fetch --prune origin main; then
              if [[ "$attempt" -lt 3 ]]; then
                sleep "$((attempt * 2))"
                continue
              fi
              break
            fi
            expected="$(git rev-parse origin/main)"
            if [[ "$(git rev-parse HEAD)" == "$expected" ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$(git rev-parse HEAD^)" != "$expected" ]]; then
              git rebase origin/main
            fi
            if git push origin HEAD:refs/heads/main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep "$((attempt * 2))"
            fi
          done
          echo "Could not publish the refreshed snapshot after three push attempts." >&2
          exit 1
      - name: Publish refreshed snapshot
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main
